<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
/* Fuente única de verdad del modo: clase en <html> antes de pintar */
(function(){ var m=window.matchMedia("(max-width:820px)").matches;
  document.documentElement.classList.add(m?"es-movil":"es-escritorio"); })();
</script>

<title>Comentario IASB — mayo 2026 · NIIF</title>
<meta name="description" content="Resumen mensual de las novedades del IASB. Mayo de 2026.">
<meta property="og:type" content="article">
<meta property="og:locale" content="es_ES">
<meta property="og:site_name" content="NIIF · Normas Internacionales de Información Financiera">
<meta property="og:title" content="Comentario IASB — mayo 2026">
<meta property="og:description" content="Resumen mensual de las novedades del IASB.">
<meta property="og:url" content="https://TU-DOMINIO.es/publicaciones/comentario-iasb-mayo-2026.html">
<meta property="og:image" content="https://TU-DOMINIO.es/img/og-niif.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<script src="../js/layout.js" defer></script>
<style>
  /* Tokens de identidad y reset: ../css/base.css. Aquí, solo el CSS propio del artículo. */

  /* Header, footer, menú móvil y modal legal: estilos en ../js/layout.js (compartidos) */

  /* Layout de página: escritorio fijo (sin scroll), móvil normal */
  html.es-escritorio body{ display:flex; flex-direction:column; overflow:hidden; }
  html.es-movil body{ overflow:auto; }

  /* Mostrar/ocultar según modo (partes propias del artículo) */
  html.es-escritorio .movil-bloque{ display:none !important; }
  html.es-movil .visor--desktop, html.es-movil .art__acc{ display:none !important; }

  /* ===== ARTÍCULO ===== */
  html.es-escritorio .art{ flex:1 1 auto; display:flex; flex-direction:column; padding:clamp(1rem,3vh,1.8rem) var(--marco) 0; overflow:hidden; min-height:0; }
  html.es-movil .art{ padding:clamp(1.2rem,3vh,2rem) var(--marco) 2.4rem; max-width:60rem; margin:0 auto; }
  .art__cab{ display:flex; align-items:flex-end; justify-content:space-between; gap:1.5rem; flex-wrap:wrap; border-bottom:var(--linea) solid var(--line); padding-bottom:1rem; margin-bottom:1.2rem; }
  .art__meta .cat{ font-size:.66rem; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin:0; }
  .art__meta h1{ margin:.35rem 0 .3rem; font-weight:900; font-size:clamp(1.5rem,3.4vw,2.4rem); line-height:1.06; letter-spacing:-.01em; }
  .art__meta .fecha{ font-size:.8rem; letter-spacing:.06em; color:var(--muted); margin:0; }
  .art__acc{ display:flex; gap:.6rem; flex:none; }
  .art__b{ display:inline-flex; align-items:center; gap:.5rem; cursor:pointer; text-decoration:none; font-weight:700; font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; border:var(--linea) solid var(--line); background:var(--paper); color:var(--ink); padding:.7rem 1.1rem; }
  .art__b:hover{ background:var(--ink); color:var(--paper); }
  .art__b--full{ background:var(--ink); color:var(--paper); }
  .art__b--full:hover{ opacity:.85; }

  /* Visor de ESCRITORIO (PDF.js con zoom) */
  .visor--desktop{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; border:var(--linea) solid var(--line); margin-bottom:clamp(1rem,3vh,1.8rem); }
  .visor__barra{ flex:none; display:flex; align-items:center; gap:.4rem; padding:.5rem .7rem; border-bottom:var(--linea) solid var(--line); background:var(--paper); }
  .visor__z{ display:inline-flex; align-items:center; justify-content:center; width:2rem; height:2rem; cursor:pointer; background:var(--paper); color:var(--ink); border:1px solid var(--line); font-weight:800; font-size:1rem; line-height:1; }
  .visor__z:hover{ background:var(--ink); color:var(--paper); }
  .visor__nivel{ min-width:3.4rem; text-align:center; font-size:.72rem; letter-spacing:.06em; font-variant-numeric:tabular-nums; }
  .visor__sep{ width:1px; align-self:stretch; background:rgba(0,0,0,.2); margin:.2rem .5rem; }
  .visor__fit{ cursor:pointer; background:var(--paper); color:var(--ink); border:1px solid var(--line); font:inherit; font-size:.64rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; padding:.45rem .7rem; }
  .visor__fit:hover{ background:var(--ink); color:var(--paper); }
  .visor__pag{ margin-left:auto; font-size:.7rem; letter-spacing:.06em; color:var(--muted); font-variant-numeric:tabular-nums; }
  .visor__lienzo{ flex:1 1 auto; min-height:0; overflow:auto; background:#e9e9e9; padding:14px; }
  .pdf-pagina{ display:block; margin:0 auto 12px; background:#fff; box-shadow:0 1px 6px rgba(0,0,0,.25); max-width:100%; }
  .visor__cargando{ padding:2rem; text-align:center; font-size:.8rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }

  /* Bloque MÓVIL: previa (más estrecha que la línea) + botones apilados */
  .movil-bloque{ display:block; }
  .previa{ width:86%; margin:0 auto; border:var(--linea) solid var(--line); background:#fff; overflow:hidden; height:clamp(240px,42vh,420px); }
  .previa img{ display:block; width:100%; height:auto; }
  .previa-linea{ border:0; border-top:var(--linea) solid var(--line); margin:0 0 1.5rem; }
  .acciones{ display:flex; flex-direction:column; gap:.7rem; }
  .acc{ display:block; width:100%; text-align:center; text-decoration:none; cursor:pointer; background:var(--ink); color:var(--paper); border:var(--linea) solid var(--ink); font-weight:800; font-size:1rem; letter-spacing:.1em; text-transform:uppercase; padding:1.1rem 1rem; }
  .acc:hover{ background:#fff; color:var(--ink); }

  :focus-visible{ outline:3px solid var(--ink); outline-offset:2px; }

  /* ===== LOADING DE ENTRADA (barrido NIIF al cargar) ===== */
  .cargando-inicio{ position:fixed; inset:0; z-index:120; background:var(--ink); color:var(--paper);
    display:flex; align-items:center; justify-content:center; transform:scaleY(1); transform-origin:top;
    transition:transform .45s cubic-bezier(.7,0,.3,1); }
  .cargando-inicio.fuera{ transform:scaleY(0); }
  .cargando-inicio b{ font-weight:900; font-size:clamp(2.5rem,9vw,6rem); letter-spacing:.04em; }
  .cargando-inicio i{ font-style:normal; display:block; text-align:center; font-weight:500; font-size:.7rem;
    letter-spacing:.3em; margin-top:.6rem; color:#bdbdbd; }
  @media (prefers-reduced-motion:reduce){ .cargando-inicio{ transition:none; } }

</style>
</head>
<body>

<!-- ===== LOADING DE ENTRADA ===== -->
<div class="cargando-inicio" id="cargando-inicio"><div><b>NIIF</b><i>cargando</i></div></div>

<!-- Header + línea de marco + menú móvil: los inyecta ../js/layout.js -->
<div data-include="header"></div>

<!-- ===== ARTÍCULO ===== -->
<main class="art">
  <div class="art__cab">
    <div class="art__meta">
      <p class="cat">Resumen NIIF</p>
      <h1>Comentario IASB — mayo 2026</h1>
      <p class="fecha">Mayo de 2026 · 21 páginas</p>
    </div>
    <div class="art__acc">
      <button class="art__b" id="btn-compartir-esc"><span>Compartir</span></button>
      <a class="art__b art__b--full" href="../pdf/comentario-iasb-mayo-2026.pdf" download><span>Descargar PDF</span></a>
    </div>
  </div>

  <!-- ESCRITORIO: visor PDF.js -->
  <div class="visor--desktop">
    <div class="visor__barra">
      <button class="visor__z" id="z-menos" aria-label="Alejar">−</button>
      <span class="visor__nivel" id="z-nivel">100%</span>
      <button class="visor__z" id="z-mas" aria-label="Acercar">+</button>
      <span class="visor__sep"></span>
      <button class="visor__fit" id="z-ancho">Ajustar a ancho</button>
      <span class="visor__pag" id="pag-info"></span>
    </div>
    <div class="visor__lienzo" id="lienzo"><div class="visor__cargando" id="cargando-pdf">Cargando documento…</div></div>
  </div>

  <!-- MÓVIL: previsualización + botones -->
  <div class="movil-bloque">
    <div class="previa"><img src="../img/comentario-iasb-mayo-2026-portada.jpg" alt="Primera página del documento"></div>
    <hr class="previa-linea">
    <div class="acciones">
      <a class="acc" href="../pdf/comentario-iasb-mayo-2026.pdf" target="_blank" rel="noopener">Abrir documento</a>
      <a class="acc" href="../pdf/comentario-iasb-mayo-2026.pdf" download>Descargar</a>
      <button class="acc" id="btn-compartir-mov" type="button">Compartir</button>
    </div>
  </div>
</main>

<!-- Línea de marco + footer: los inyecta ../js/layout.js -->
<div data-include="footer"></div>

<script src="../vendor/pdf.min.js"></script>
<script>
/* Loading de entrada: se retira al cargar */
(function(){
  var c=document.getElementById("cargando-inicio"); if(!c) return;
  function quitar(){ c.classList.add("fuera"); setTimeout(function(){ if(c&&c.parentNode) c.parentNode.removeChild(c); },600); }
  window.addEventListener("load",function(){ setTimeout(quitar,550); });
  setTimeout(quitar,2500); // salvaguarda por si "load" tarda
})();

/* Header/menú hamburguesa, logos del footer y modal legal: en ../js/layout.js */

/* Compartir (escritorio y móvil) */
function compartir(){ var url=location.href, t=document.title;
  if(navigator.share){ navigator.share({title:t,url:url}).catch(function(){}); }
  else{ window.open("https://www.linkedin.com/sharing/share-offsite/?url="+encodeURIComponent(url),"_blank","noopener,width=600,height=680"); } }
["btn-compartir-esc","btn-compartir-mov"].forEach(function(id){ var el=document.getElementById(id); if(el) el.addEventListener("click",compartir); });

/* ===== Visor PDF.js — SOLO escritorio ===== */
var visorIniciado=false;
function esMovil(){ return window.matchMedia("(max-width:820px)").matches; }
function initVisor(){
  if(visorIniciado || esMovil() || !window.pdfjsLib) return;
  visorIniciado=true;
  pdfjsLib.GlobalWorkerOptions.workerSrc="../vendor/pdf.worker.min.js";
  var RUTA_PDF="../pdf/comentario-iasb-mayo-2026.pdf";   /* ✏️ ruta al PDF */
  var lienzo=document.getElementById("lienzo"), nivelTxt=document.getElementById("z-nivel"), pagInfo=document.getElementById("pag-info");
  var escala=1, doc=null, paginas=[], baseAnchos=[]; var MIN=0.5, MAX=3;
  function anchoDisponible(){ return lienzo.clientWidth-28; }
  function render(){ if(!doc) return; nivelTxt.textContent=Math.round(escala*100)+"%";
    paginas.forEach(function(item){ var vp=item.page.getViewport({scale:escala}); var c=item.canvas;
      var dpr=Math.min(window.devicePixelRatio||1,2); c.width=Math.floor(vp.width*dpr); c.height=Math.floor(vp.height*dpr);
      c.style.width=Math.floor(vp.width)+"px"; c.style.height=Math.floor(vp.height)+"px";
      var ctx=c.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
      if(item.task) item.task.cancel(); item.task=item.page.render({canvasContext:ctx,viewport:vp}); }); }
  function ajustarAncho(){ if(!baseAnchos.length) return; var maxBase=Math.max.apply(null,baseAnchos);
    escala=Math.max(MIN,Math.min(MAX,(anchoDisponible())/maxBase)); render(); }
  pdfjsLib.getDocument(RUTA_PDF).promise.then(function(pdf){ doc=pdf;
    var cg=document.getElementById("cargando-pdf"); if(cg) cg.remove();
    pagInfo.textContent=pdf.numPages+" páginas";
    var chain=Promise.resolve();
    for(var n=1;n<=pdf.numPages;n++){ (function(n){ chain=chain.then(function(){ return pdf.getPage(n).then(function(page){
      var vp1=page.getViewport({scale:1}); baseAnchos.push(vp1.width);
      var c=document.createElement("canvas"); c.className="pdf-pagina"; lienzo.appendChild(c);
      paginas.push({page:page,canvas:c,task:null}); }); }); })(n); }
    chain.then(function(){ ajustarAncho(); });
  }).catch(function(){ var cg=document.getElementById("cargando-pdf"); if(cg) cg.textContent="No se pudo cargar el documento."; });
  document.getElementById("z-mas").addEventListener("click",function(){ if(!doc)return; escala=Math.min(MAX,escala+0.15); render(); });
  document.getElementById("z-menos").addEventListener("click",function(){ if(!doc)return; escala=Math.max(MIN,escala-0.15); render(); });
  document.getElementById("z-ancho").addEventListener("click",ajustarAncho);
  var t; window.addEventListener("resize",function(){ clearTimeout(t); t=setTimeout(ajustarAncho,200); });
}
if(!esMovil()) initVisor();
/* Cambiar de modo al redimensionar */
window.addEventListener("resize",function(){
  var m=esMovil(), el=document.documentElement;
  el.classList.toggle("es-movil",m); el.classList.toggle("es-escritorio",!m);
  if(!m) initVisor();
});
</script>
</body>
</html>
